# Java built-in logging configuration
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Minimum application logging level
.level=INFO
com.christina.builddemo.level=FINE
com.christina.builddemo.BuildServer.level=FINE

# Console logging
java.util.logging.ConsoleHandler.level=FINE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# File logging
java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.pattern=logs/buildprocess.%g.log
java.util.logging.FileHandler.limit=1000000
java.util.logging.FileHandler.count=3
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# Format: timestamp, severity, message, exception
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s %5$s%6$s%n
